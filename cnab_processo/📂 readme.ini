– CNAB 400 Bradesco (Processamento e Separação)

1. Objetivo

Este script tem como finalidade:

- Processar arquivos CNAB 400 do Bradesco
- Quebrar arquivos grandes em múltiplos CNABs menores
- Permitir ao analista definir, em tempo de execução,
  quantos títulos cada CNAB gerado terá
- Atualizar corretamente o trailer de cada CNAB gerado com:
  - Quantidade de títulos
  - Valor total em cobrança (posição 026–039)
  - Total de registros (linhas)
- Garantir que a soma de todos os CNABs gerados
  seja exatamente igual ao valor do CNAB original
- Exibir relatórios amigáveis no console para conferência

Observação:
Valor pago por título não é necessário para envio de remessa.
O script trabalha exclusivamente com o valor nominal dos títulos.

--------------------------------------------------------------------

2. Estrutura de pastas

cnab_processo/
│
├─ cnab_origem/          <- Coloque aqui o CNAB 400 original (.txt)
├─ cnab_saida/           <- CNABs separados serão gerados aqui
├─ separar_cnab.py       <- Script Python principal
├─ README.txt            <- Este arquivo

--------------------------------------------------------------------

3. Funcionamento atual do script

- O script lê o CNAB 400 original da pasta cnab_origem
- O arquivo deve conter:
  - 1 Header
  - N registros de detalhe
  - 1 Trailer

- Durante a execução, o analista informa:
  Quantos títulos cada CNAB gerado deve conter

- O script então:
  - Divide os detalhes em blocos conforme o número informado
  - Mantém o header original em todos os CNABs gerados
  - Recalcula o trailer de cada CNAB individualmente
  - Gera arquivos prontos para envio bancário

Nenhuma configuração manual no código é necessária.

--------------------------------------------------------------------

4. Como rodar

1. Coloque o arquivo CNAB 400 original na pasta cnab_origem
2. Certifique-se de que exista apenas um arquivo .txt na pasta
3. Execute o script:

python separar_cnab.py

4. Informe, quando solicitado, a quantidade de títulos por CNAB

O script irá gerar os arquivos na pasta cnab_saida
e exibir no console os dados de conferência.

--------------------------------------------------------------------

5. Conferência exibida no console

Para cada CNAB gerado, o script exibe:

- Nome do arquivo gerado
- Quantidade de títulos
- Valor total em cobrança do CNAB
- Total de linhas (Header + Detalhes + Trailer)

Exemplo:

Gerado: PGDT030824_001.txt | Titulos: 10 | Valor CNAB: R$ 127.117,19 | Linhas: 12
Gerado: PGDT030824_002.txt | Titulos: 10 | Valor CNAB: R$ 127.305,20 | Linhas: 12
...

Ao final, é exibido o resumo geral:

- Total de títulos processados
- Valor total em cobrança consolidado

Esse valor confere exatamente com o trailer do CNAB original.

--------------------------------------------------------------------

6. Trailer e regras de cálculo

O trailer de cada CNAB gerado é recalculado dinamicamente:

- Posições 018–025
  Quantidade de títulos do CNAB

- Posições 026–039
  Valor total em cobrança do CNAB
  (campo numérico, em centavos, sem separadores)

- Últimas 6 posições
  Total de linhas do arquivo
  (Header + Detalhes + Trailer)

O valor de cada título é extraído da posição 153–165
do registro de detalhe.

--------------------------------------------------------------------

7. Observações finais

- O script não calcula ou considera valor pago
- Apenas valores nominais dos títulos são somados
- A formatação em reais (R$, ponto e vírgula)
  é utilizada apenas para exibição no console
- Os arquivos gerados seguem estritamente
  o layout CNAB 400 e estão prontos para envio bancário

